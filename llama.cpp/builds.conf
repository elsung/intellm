# Registry of llama.cpp builds the launcher knows about.
# Format (pipe-separated, leading/trailing whitespace ignored):
#   shortname | display_name | bin_dir | env_setup_script_or_blank | extra_runtime_args_or_blank
#
# - shortname: used with `intellm --build <shortname>` (no spaces)
# - bin_dir / env_setup_script: relative to $INTELLM_HOME, or absolute
# - env_setup_script: sourced before running (oneAPI setvars, env vars, etc.)
# - extra_runtime_args: appended verbatim to every launch from this build
#
# Add a line per build. To add a CUDA build for the P100s later, just
# append another line; intellm will pick it up automatically.

vulkan | Vulkan (Intel B70)              | llama.cpp/build-vulkan-intel/bin | |                                 --device Vulkan0
sycl   | SYCL (Intel B70, optimized)     | llama.cpp/build-sycl-intel/bin   | llama.cpp/env-sycl.sh |
