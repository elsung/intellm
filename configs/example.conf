# intellm named config — shell-style key=value, sourced by the launcher.
# Copy/rename to <something>.conf and use with: intellm --config <something>
#
# Any value omitted falls back to interactive prompt (or other CLI flags).
# Any value here is overridden by an explicit CLI flag.

# build:   shortname from llama.cpp/builds.conf (e.g. vulkan, sycl)
build=sycl

# mode:    chat | server | bench
mode=chat

# model:   GGUF filename under MODELS_DIR, an absolute path,
#          or hf:<repo>:<quant> for auto-download from Hugging Face.
model=Qwen3.6-27B-Q6_K.gguf

# ctx:     context window in tokens
ctx=32768

# kv:      KV cache precision: f16 | q8_0 | q4_0
kv=q8_0

# --- server-only fields ---
# host=0.0.0.0
# port=8080
# slots=1

# --- chat-only ---
# prompt_cache=coding-agent   # snapshots KV state to $KVCACHE_DIR/<name>.bin
